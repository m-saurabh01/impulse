spring.application.name=pulsemail

# ============================================
# DATABASE CONFIGURATION
# ============================================
# Use environment variables for security (recommended for production)
# Set these in your OS or container: DB_URL, DB_USERNAME, DB_PASSWORD
# 
# For Development (hardcoded - NOT for production):
spring.datasource.url=jdbc:mysql://localhost:3306/pulse_db
spring.datasource.username=root
spring.datasource.password=johan7154
#
# For Production (use environment variables):
# spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pulse_db}
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
#
# HOW TO SET ENVIRONMENT VARIABLES:
# ---------------------------------
# Windows (Command Prompt):
#   set DB_URL=jdbc:mysql://your-server:3306/pulse_db
#   set DB_USERNAME=your_username
#   set DB_PASSWORD=your_password
#
# Windows (PowerShell):
#   $env:DB_URL="jdbc:mysql://your-server:3306/pulse_db"
#   $env:DB_USERNAME="your_username"
#   $env:DB_PASSWORD="your_password"
#
# Linux/macOS:
#   export DB_URL=jdbc:mysql://your-server:3306/pulse_db
#   export DB_USERNAME=your_username
#   export DB_PASSWORD=your_password
#
# Docker:
#   docker run -e DB_URL=... -e DB_USERNAME=... -e DB_PASSWORD=... your-image
#
# Tomcat (setenv.sh):
#   export JAVA_OPTS="$JAVA_OPTS -DDB_URL=... -DDB_USERNAME=... -DDB_PASSWORD=..."

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# CONNECTION POOLING (HikariCP - Default in Spring Boot)
# Optimized for 100 concurrent users
# ============================================
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=PulseMailHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# HIBERNATE PERFORMANCE OPTIMIZATIONS
# ============================================
# Batch operations for improved performance
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Query plan caching
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# Second-level cache (optional - enable for read-heavy workload)
# spring.jpa.properties.hibernate.cache.use_second_level_cache=true
# spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory

# Statistics (disable in production)
spring.jpa.properties.hibernate.generate_statistics=false

# ============================================
# MYSQL OPTIMIZATIONS
# ============================================
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

server.error.whitelabel.enabled=false
server.error.path=/error

# ============================================
# SERVER & TOMCAT PERFORMANCE
# ============================================
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.accept-count=100
server.tomcat.max-connections=8192
server.tomcat.connection-timeout=20000

# ============================================
# SESSION MANAGEMENT
# ============================================
server.servlet.session.timeout=30m

# ============================================
# EMAIL DOMAIN CONFIGURATION
# ============================================
# All user emails must end with this domain
impulse.email.domain=@impulse.iaf.in

# Attachment config
mail.attachments.base-path=/Users/SA20464227/Documents/workspace-spring-tool-suite-4-4.18.0.RELEASE/attachments
mail.attachments.max-size=10485760   
mail.attachments.allowed-types=*

# ============================================
# HTTPS / SSL CONFIGURATION (Currently Disabled)
# ============================================
# Uncomment below lines to enable HTTPS
#
# server.port=8443
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=impulse
#
# ============================================
# HOW TO ENABLE HTTPS - Complete Guide
# ============================================
#
# STEP 1: Install Required Software
# ----------------------------------
# Option A: Use Java Keytool (included with JDK)
#   - Already installed with your JDK
#   - Location: $JAVA_HOME/bin/keytool
#
# Option B: Use OpenSSL (for production certificates)
#   - macOS: brew install openssl
#   - Ubuntu: sudo apt-get install openssl
#   - Windows: Download from https://slproweb.com/products/Win32OpenSSL.html
#
# STEP 2: Generate SSL Certificate
# ----------------------------------
# Option A: Self-Signed Certificate (Development/Testing)
#
#   keytool -genkeypair -alias impulse -keyalg RSA -keysize 2048 \
#     -storetype PKCS12 -keystore keystore.p12 -validity 365 \
#     -storepass changeit -dname "CN=localhost, OU=Impulse, O=Wipro, L=Bangalore, ST=Karnataka, C=IN"
#
#   Then copy keystore.p12 to src/main/resources/
#
# Option B: Let's Encrypt (Production - Free)
#   1. Install Certbot: sudo apt install certbot
#   2. Get certificate: sudo certbot certonly --standalone -d impulse.iaf.in
#   3. Convert to PKCS12:
#      openssl pkcs12 -export -in /etc/letsencrypt/live/impulse.iaf.in/fullchain.pem \
#        -inkey /etc/letsencrypt/live/impulse.iaf.in/privkey.pem \
#        -out keystore.p12 -name impulse -passout pass:yourpassword
#
# Option C: Commercial Certificate (Production)
#   1. Generate CSR: 
#      keytool -certreq -alias impulse -keystore keystore.p12 -file impulse.csr
#   2. Submit CSR to CA (DigiCert, Comodo, etc.)
#   3. Import signed certificate:
#      keytool -import -alias impulse -file certificate.cer -keystore keystore.p12
#
# STEP 3: Enable HTTPS in this file
# ----------------------------------
#   1. Uncomment the server.ssl.* lines above
#   2. Set SSL_KEYSTORE_PASSWORD environment variable (or change in config)
#   3. Uncomment HTTPS settings in SecurityConfig.java
#
# STEP 4: Redirect HTTP to HTTPS (Optional)
# ----------------------------------
#   Uncomment the requiresChannel() section in SecurityConfig.java
#
# STEP 5: Test
# ----------------------------------
#   Access: https://localhost:8443
#   Browser will warn about self-signed cert (click Advanced > Proceed)
#
# TO DISABLE HTTPS:
# ----------------------------------
#   1. Comment out all server.ssl.* lines above
#   2. Set server.port=8080
#   3. Comment out HTTPS settings in SecurityConfig.java

# ============================================
# DATA CLEANUP CONFIGURATION
# ============================================
# Enable/disable automated cleanup scheduler
cleanup.scheduler.enabled=true

# Retention periods (in days) - items older than this will be deleted
cleanup.trash.retention-days=30
cleanup.draft.retention-days=60
cleanup.deleted-user.retention-days=90

# Cleanup schedule (cron expressions)
# Full cleanup: Daily at 2:00 AM
cleanup.schedule.full=0 0 2 * * ?
# Trash cleanup: Every 6 hours
cleanup.schedule.trash=0 0 */6 * * ?
# Attachment sync: Sundays at 3:00 AM
cleanup.schedule.attachments=0 0 3 ? * SUN